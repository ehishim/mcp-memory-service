[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory-service"
version = "6.13.2"
description = "Minimal MCP memory service with sqlite-vec for Docker deployment"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "claude-desktop", "sqlite-vec", "semantic-memory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
authors = [
    { name = "Heinrich Krupp", email = "heinrich.krupp@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "chromadb==0.5.23",
    "tokenizers==0.20.3",
    "mcp>=1.0.0,<2.0.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "PyPDF2>=3.0.0",
    "chardet>=5.0.0"
]

[project.scripts]
mcp-memory-server = "mcp_memory_service.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory_service"]